<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Be My Valentine?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(20px);
    padding: 40px 60px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

/* TITLE */
h1 {
    font-size: 3em;
    color: white;
    -webkit-text-stroke: 2px black;
    text-shadow:
        2px 2px 0 black,
        -2px 2px 0 black,
        2px -2px 0 black,
        -2px -2px 0 black;
}

/* COUNTDOWN */
#countdown {
    font-size: 1.5em;
    font-weight: bold;
    color: #ff4da6;
}

/* TEDDY IMAGE */
img {
    width: 250px;
    margin: 20px 0;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
}

/* BUTTONS */
button {
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: 0.3s ease;
    margin: 10px;
}

#yesBtn {
    background-color: #ff69b4;
    color: white;
    font-size: 1.2em;
    border-radius: 12px;
}

#yesBtn:hover {
    background-color: #ff85c1;
    transform: scale(1.1);
}

#noBtn {
    background-color: #ff3b3b;
    color: white;
    font-size: 1.2em;
    border-radius: 12px;
}

/* FLOATING HEARTS (FIRST SCREEN) */
.heart {
    position: absolute;
    animation: floatUp 7s linear forwards;
    filter: drop-shadow(0 0 8px rgba(255,105,180,0.8));
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh) translateX(0);
        opacity: 1;
    }

    50% {
        transform: translateY(50vh) translateX(40px);
        opacity: 1;
    }

    100% {
        transform: translateY(-10vh) translateX(-40px);
        opacity: 0;
    }
}

/* CONFETTI */
.confetti {
    position: fixed;
    font-size: 20px;
    pointer-events: none;
    z-index: 9999;
}

/* REVEAL SCREEN */
.reveal {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-top: 100px;
    animation: fadeIn 1.5s ease forwards;
}

#heart-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.reveal {
    position: relative;
    z-index: 2;
}

.yay {
    font-size: 70px;
    color: white;
}

.scan-text {
    font-size: 24px;
    margin: 20px;
    font-weight: bold;
    color: #FA8FAD;
}

.qr-code {
    width: 260px;
    margin-top: 20px;
    animation: popIn 1s ease;
}

@keyframes popIn {
    0% { transform: scale(0); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

</style>
</head>

<body>

<div class="card">
    <h1>Will you be my Valentine? &lt;3</h1>
    <div id="countdown"></div>
    <img src="cute_teddy.png">
    <div>
        <button id="yesBtn">YES :D</button>
        <button id="noBtn">No :c</button>
    </div>
</div>

<script>

// COUNTDOWN
var countDownDate = new Date("Feb 14, 2026 20:00:00").getTime();

setInterval(function() {
    var now = new Date().getTime();
    var distance = countDownDate - now;

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s until Valentine's!";
}, 1000);

// FLOATING HEARTS (FIRST SCREEN)
let firstScreenHearts = setInterval(function(){

    const hearts = ["♡"];

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left = Math.random()*window.innerWidth + "px";
    heart.style.fontSize = (Math.random()*35 + 30) + "px"; // MUCH BIGGER

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),7000);

}, 250); // MORE FREQUENT


// BUTTON LOGIC
let noBtn = document.getElementById("noBtn");
let yesBtn = document.getElementById("yesBtn");
let yesSize = 18;

noBtn.addEventListener("mouseover", function(){
    let x = Math.random()*300 - 150;
    let y = Math.random()*200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px) scale(0.7)`;
    yesSize += 2;
    yesBtn.style.fontSize = yesSize + "px";
});

yesBtn.addEventListener("click", function(){

    clearInterval(firstScreenHearts);

    document.body.innerHTML = `
        <div id="heart-layer"></div>

        <div class="reveal">
            <h1 class="yay">YAY :D</h1>
            <p class="scan-text">Scan me for our date itinerary ;)</p>
            <img src="qr.png" class="qr-code">
        </div>
    `;

    document.body.style.background = "white";

    launchConfetti();
    floatingHeartsWhiteScreen();
});

// CONFETTI
function launchConfetti() {
    const hearts = ["💖","💘","💕","💗","💓"];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < 100; i++) {
        const heart = document.createElement("div");
        heart.classList.add("confetti");
        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

        document.body.appendChild(heart);

        heart.style.left = centerX + "px";
        heart.style.top = centerY + "px";

        const angle = Math.random() * 2 * Math.PI;
        const velocity = Math.random() * 7 + 4;

        let x = 0;
        let y = 0;
        let gravity = 0.18;

        function animate() {
            x += Math.cos(angle) * velocity;
            y += Math.sin(angle) * velocity + gravity;
            gravity += 0.05;

            heart.style.transform =
                `translate(${x}px, ${y}px) rotate(${x * 4}deg)`;

            requestAnimationFrame(animate);
        }

        animate();
        setTimeout(() => heart.remove(), 3000);
    }
}

// FLOATING HEARTS (WHITE SCREEN)
function floatingHeartsWhiteScreen() {

    const heartLayer = document.getElementById("heart-layer");
    const hearts = ["♡"];

    setInterval(function(){

        let heart = document.createElement("div");
        heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

        heart.style.position = "absolute";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = window.innerHeight + "px";

        heart.style.fontSize = (Math.random()*40 + 30) + "px";
        heart.style.opacity = "0.8";
        heart.style.animation = "floatUp 7s linear forwards";
        heart.style.pointerEvents = "none";
        heart.style.zIndex = "0";  
        heart.style.filter = "drop-shadow(0 0 12px hotpink)";

        heartLayer.appendChild(heart);

        setTimeout(()=>heart.remove(),7000);

    }, 250);
}



</script>

</body>
</html>
